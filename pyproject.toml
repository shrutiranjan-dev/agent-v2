[project]
name = "agent-platform-python"
version = "0.1.0"
description = "Local-first Python AI agent runtime platform with Ollama, FastAPI, PostgreSQL, and a React dashboard."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Agent Platform Contributors" }]
dependencies = [
  "alembic>=1.13.2",
  "asyncpg>=0.29.0",
  "clickhouse-connect>=0.7.19",
  "fastapi[standard]>=0.115.0",
  "httpx>=0.27.2",
  "mcp>=1.27.2",
  "minio>=7.2.8",
  "neo4j>=5.23.1",
  "pgvector>=0.3.2",
  "psycopg[binary]>=3.2.1",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "qdrant-client>=1.11.1",
  "redis>=5.0.8",
  "rich>=13.8.0",
  "sqlalchemy[asyncio]>=2.0.32",
  "typer>=0.12.5",
  "uvicorn[standard]>=0.30.6",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.24.0",
  "respx>=0.21.1",
  "ruff>=0.8.0",
]

[project.scripts]
agent-platform = "backend.app.cli:app"
agent-platform-worker = "backend.app.queue.worker:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["external*", "frontend*", "docs*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
